{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Menu — AI Personal Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #dce8f5 0%, #eaf1fb 50%, #d6e8f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 40px rgba(30,42,94,0.10);
      padding: 3rem 4rem 2.5rem;
      width: 100%;
      max-width: 600px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #1e2a5e;
      text-align: center;
      margin-bottom: 0;
    }
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }
    .menu-btn {
      background: #1e2a5e;
      color: #fff;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: block;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(30,42,94,0.20);
    }
    .menu-btn:hover {
      background: #16215a;
      transform: translateY(-2px);
    }
    .back-btn {
      background: #1e2a5e;
      color: #fff;
      border: none;
      padding: 0.65rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #16215a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Info Menu</h1>

    <div class="menu-buttons">
      <a href="/info/abstract/" class="menu-btn">Abstract</a>
      <a href="/info/algorithm/" class="menu-btn">Algorithm</a>
      <a href="/info/homepage/" class="menu-btn">Home Page</a>
      <a href="/accounts/login/" class="menu-btn">Login</a>
    </div>

    <a href="/" class="back-btn">← Back</a>
  </div>
</body>
</html>
